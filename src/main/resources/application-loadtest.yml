spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/eap_order_db
    username: admin
    password: admin123
    hikari:
      maximum-pool-size: ${EAP_ORDER_COMMAND_POOL_SIZE:35}
      minimum-idle: ${EAP_ORDER_COMMAND_POOL_MIN_IDLE:${EAP_ORDER_COMMAND_POOL_SIZE:35}}
  rabbitmq:
    cache:
      channel:
        size: 128
  data:
    redis:
      lettuce:
        pool:
          enabled: ${EAP_REDIS_LETTUCE_POOL_ENABLED:false}
          max-active: ${EAP_REDIS_LETTUCE_POOL_MAX_ACTIVE:64}
          max-idle: ${EAP_REDIS_LETTUCE_POOL_MAX_IDLE:64}
          min-idle: ${EAP_REDIS_LETTUCE_POOL_MIN_IDLE:16}
          max-wait: ${EAP_REDIS_LETTUCE_POOL_MAX_WAIT:500ms}

eap:
  redis:
    share-native-connection: ${EAP_REDIS_SHARE_NATIVE_CONNECTION:true}
  order:
    submission:
      write-mode: ${EAP_ORDER_SUBMISSION_WRITE_MODE:current_order_path}
    submission-head-projector:
      enabled: ${EAP_ORDER_SUBMISSION_HEAD_PROJECTOR_ENABLED:false}
      batch-size: ${EAP_ORDER_SUBMISSION_HEAD_PROJECTOR_BATCH_SIZE:500}
      max-batches-per-tick: ${EAP_ORDER_SUBMISSION_HEAD_PROJECTOR_MAX_BATCHES_PER_TICK:4}
      poll-interval-ms: ${EAP_ORDER_SUBMISSION_HEAD_PROJECTOR_POLL_INTERVAL_MS:25}
    submission-event-store-relay:
      enabled: ${EAP_ORDER_SUBMISSION_EVENT_STORE_RELAY_ENABLED:false}
      batch-size: ${EAP_ORDER_SUBMISSION_EVENT_STORE_RELAY_BATCH_SIZE:500}
      poll-interval-ms: ${EAP_ORDER_SUBMISSION_EVENT_STORE_RELAY_POLL_INTERVAL_MS:25}
      confirm-timeout-ms: ${EAP_ORDER_SUBMISSION_EVENT_STORE_RELAY_CONFIRM_TIMEOUT_MS:5000}
    market-data-scheduler:
      enabled: false
    status:
      realtime-updates-enabled: ${EAP_ORDER_REALTIME_UPDATES_ENABLED:false}
    market-sequence:
      allocation-block-size: ${EAP_ORDER_MARKET_SEQUENCE_ALLOCATION_BLOCK_SIZE:1}
    datasource:
      consumer:
        maximum-pool-size: ${EAP_ORDER_CONSUMER_POOL_SIZE:20}
        minimum-idle: ${EAP_ORDER_CONSUMER_POOL_MIN_IDLE:5}
      projection:
        maximum-pool-size: ${EAP_ORDER_PROJECTION_POOL_SIZE:3}
        minimum-idle: ${EAP_ORDER_PROJECTION_POOL_MIN_IDLE:1}
    listeners:
      asset-reservation-confirmed:
        concurrency: ${EAP_ORDER_ASSET_RESERVATION_CONFIRMED_CONCURRENCY:16}
        batch-size: ${EAP_ORDER_ASSET_RESERVATION_CONFIRMED_BATCH_SIZE:50}
        receive-timeout-ms: ${EAP_ORDER_ASSET_RESERVATION_CONFIRMED_RECEIVE_TIMEOUT_MS:25}
        single-round-trip-enabled: ${EAP_ORDER_ASSET_RESERVATION_CONFIRMED_SINGLE_ROUND_TRIP_ENABLED:true}
      asset-reservation-failed:
        concurrency: ${EAP_ORDER_ASSET_RESERVATION_FAILED_CONCURRENCY:4}
      order-matched:
        concurrency: ${EAP_ORDER_MATCHED_CONCURRENCY:16}
      trade-executed:
        concurrency: ${EAP_ORDER_TRADE_EXECUTED_CONCURRENCY:12}
        batch-size: ${EAP_ORDER_TRADE_EXECUTED_BATCH_SIZE:50}
        receive-timeout-ms: ${EAP_ORDER_TRADE_EXECUTED_RECEIVE_TIMEOUT_MS:25}
    trade-execution-reconciler:
      poll-interval-ms: ${EAP_ORDER_TRADE_EXECUTION_RECONCILER_POLL_INTERVAL_MS:100}
      initial-delay-ms: ${EAP_ORDER_TRADE_EXECUTION_RECONCILER_INITIAL_DELAY_MS:500}
      batch-size: ${EAP_ORDER_TRADE_EXECUTION_RECONCILER_BATCH_SIZE:100}
      lease-ms: ${EAP_ORDER_TRADE_EXECUTION_RECONCILER_LEASE_MS:30000}
      max-attempts: ${EAP_ORDER_TRADE_EXECUTION_RECONCILER_MAX_ATTEMPTS:20}
    trade-execution-inbox-admin:
      enabled: false
    trade-execution-inbox-metrics:
      poll-interval-ms: ${EAP_ORDER_TRADE_EXECUTION_INBOX_METRICS_POLL_INTERVAL_MS:10000}
  order-event-outbox:
    batch-size: ${EAP_ORDER_OUTBOX_BATCH_SIZE:500}
    publish-concurrency: ${EAP_ORDER_OUTBOX_PUBLISH_CONCURRENCY:1}
    batch-confirm-enabled: ${EAP_ORDER_OUTBOX_BATCH_CONFIRM_ENABLED:true}
    async-relay-enabled: ${EAP_ORDER_OUTBOX_ASYNC_RELAY_ENABLED:false}
    async-max-in-flight-batches: ${EAP_ORDER_OUTBOX_ASYNC_MAX_IN_FLIGHT_BATCHES:4}
    in-flight-timeout-seconds: ${EAP_ORDER_OUTBOX_IN_FLIGHT_TIMEOUT_SECONDS:30}
    poll-interval-ms: ${EAP_ORDER_OUTBOX_POLL_INTERVAL_MS:100}
  order-projection:
    enabled: true
    batch-size: 500
    max-batches-per-tick: 1
    poll-interval-ms: ${EAP_ORDER_PROJECTION_POLL_INTERVAL_MS:5000}
    repair:
      enabled: ${EAP_ORDER_PROJECTION_REPAIR_ENABLED:false}
      batch-size: 100
      poll-interval-ms: 60000
  rate-limit:
    enabled: ${EAP_RATE_LIMIT_ENABLED:true}
    backend: ${EAP_RATE_LIMIT_BACKEND:local}

logging:
  level:
    '[com.eap.eap_order]': WARN
    '[com.eap.eap_order.application.PlaceBuyOrderService]': WARN
    '[com.eap.eap_order.application.PlaceSellOrderService]': WARN
    '[com.eap.eap_order.controller.OrderController]': WARN
    '[org.springframework.web]': WARN
    '[org.hibernate]': WARN
