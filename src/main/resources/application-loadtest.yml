spring:
  datasource:
    url: jdbc:postgresql://localhost:15432/eap_order_db
    username: admin
    password: admin123
    hikari:
      maximum-pool-size: 35
      minimum-idle: 10

eap:
  order:
    event-sourcing:
      trade-idempotency-source: trade-application
      fast-match-from-projection:
        enabled: true
    datasource:
      consumer:
        maximum-pool-size: 20
        minimum-idle: 5
      projection:
        maximum-pool-size: 3
        minimum-idle: 1
    listeners:
      asset-reservation-confirmed:
        concurrency: 16
      asset-reservation-failed:
        concurrency: 4
      order-matched:
        concurrency: 16
      trade-executed:
        concurrency: 12
        batch-size: 50
        receive-timeout-ms: 25
  order-event-outbox:
    batch-size: 500
    poll-interval-ms: 100
  order-projection:
    enabled: true
    batch-size: 500
    max-batches-per-tick: 1
    poll-interval-ms: 5000
    repair:
      enabled: false
      batch-size: 100
      poll-interval-ms: 60000

logging:
  level:
    '[com.eap.eap_order]': WARN
    '[com.eap.eap_order.application.PlaceBuyOrderService]': WARN
    '[com.eap.eap_order.application.PlaceSellOrderService]': WARN
    '[com.eap.eap_order.controller.OrderController]': WARN
    '[org.springframework.web]': WARN
    '[org.hibernate]': WARN
