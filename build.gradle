plugins {
    id 'org.springframework.boot' version '3.5.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openapi.generator' version '7.6.0'
    id 'java'
}

group = 'com.eap'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.eap:eap-common:1.0.0'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.postgresql:postgresql'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    implementation 'jakarta.validation:jakarta.validation-api:3.0.2'
    implementation 'org.hibernate.validator:hibernate-validator:8.0.1.Final'
    implementation 'org.liquibase:liquibase-core'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.apache.commons:commons-pool2'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    compileOnly "org.projectlombok:lombok"
    annotationProcessor "org.projectlombok:lombok"

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.h2database:h2'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'eap.integration.postgres', System.getProperty('eap.integration.postgres', 'false')
}

tasks.register('postgresIntegrationTest', Test) {
    group = 'verification'
    description = 'Run PostgreSQL-backed Order event-store concurrency and hash-chain integration tests.'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'eap.integration.postgres', 'true'
    include '**/*PostgresIT.class'
    shouldRunAfter tasks.named('test')
}

tasks.register('orderHttpLoadTest', JavaExec) {
    group = 'verification'
    description = 'Load test Order HTTP acceptance and optional order-admission-chain convergence gate.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.OrderHttpLoadGenerator'
}

tasks.register('matchedE2eLoadTest', JavaExec) {
    group = 'verification'
    description = 'Seed valid Order/Wallet state and drive the matched-trade-completion chain through RabbitMQ.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.MatchedE2eLoadGenerator'
    systemProperty 'spring.profiles.active', 'loadtest'
    systemProperty 'spring.rabbitmq.listener.simple.auto-startup', 'false'
    systemProperty 'spring.datasource.url', 'jdbc:postgresql://localhost:15432/eap_order_db'
    systemProperty 'spring.datasource.username', 'admin'
    systemProperty 'spring.datasource.password', 'admin123'
    systemProperty 'spring.datasource.driver-class-name', 'org.postgresql.Driver'
    systemProperty 'spring.jpa.hibernate.ddl-auto', 'validate'
    systemProperty 'spring.liquibase.enabled', 'true'
    systemProperty 'spring.liquibase.change-log', 'classpath:db/changelog/db.changelog-master.xml'
    systemProperty 'eap.scheduling.enabled', 'false'
    systemProperty 'eap.order-event-outbox.batch-size', '0'
    systemProperty 'eap.order-projection.enabled', 'false'
}

tasks.register('httpMatchedTradeCompletionLoadTest', JavaExec) {
    group = 'verification'
    description = 'Drive BUY and SELL through HTTP, then verify Match/Order/Wallet trade convergence and queue drain.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.HttpMatchedTradeCompletionLoadGenerator'
}

tasks.register('httpCancellationLifecycleLoadTest', JavaExec) {
    group = 'verification'
    description = 'Verify HTTP cancellation through real RabbitMQ across Order, MatchEngine, and Wallet.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.HttpCancellationLifecycleLoadGenerator'
}

tasks.register('httpMatchedSteadyStateLoadTest', JavaExec) {
    group = 'verification'
    description = 'Run sustained balanced mixed-side HTTP traffic and verify throughput, backlog stability, and convergence.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.HttpMatchedSteadyStateLoadGenerator'
}

tasks.register('httpMatchedExternalPrepare', JavaExec) {
    group = 'verification'
    description = 'Prepare users, baselines, manifest, and finite Vegeta targets for external open-loop HTTP load.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.HttpMatchedExternalPrepareLoadGenerator'
}

tasks.register('httpMatchedExternalMonitor', JavaExec) {
    group = 'verification'
    description = 'Collect low-frequency durable completion and queue samples during external HTTP load.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.HttpMatchedExternalMonitor'
}

tasks.register('httpMatchedExternalVerify', JavaExec) {
    group = 'verification'
    description = 'Verify Vegeta HTTP results, full convergence, assets, trade IDs, and queue drain.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.HttpMatchedExternalVerifyLoadGenerator'
}

tasks.register('writeLoadTestRuntimeClasspath') {
    group = 'verification'
    description = 'Write the test runtime classpath for low-overhead direct load-test helper JVMs.'
    doLast {
        def output = providers.gradleProperty('loadTestClasspathOutput').getOrNull()
        if (output == null || output.isBlank()) {
            throw new GradleException('-PloadTestClasspathOutput is required')
        }
        def outputFile = file(output)
        outputFile.parentFile.mkdirs()
        outputFile.text = sourceSets.test.runtimeClasspath.asPath
    }
}

tasks.register('httpMatchedResetLoadTest', JavaExec) {
    group = 'verification'
    description = 'Reset HTTP matched-trade databases, queues, and Redis before services start.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.HttpMatchedResetLoadGenerator'
}

tasks.register('httpMatchedStaircaseLoadTest', JavaExec) {
    group = 'verification'
    description = 'Ramp balanced mixed-side HTTP traffic through configurable stages and find the sustained capacity knee.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.HttpMatchedStaircaseLoadGenerator'
}

tasks.register('preparedHttpLoadDriverCalibration', JavaExec) {
    group = 'verification'
    description = 'Calibrate the prepared synchronous HTTP driver against an in-process no-op endpoint.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.PreparedHttpLoadDriverCalibration'
}

tasks.register('orderDbCeilingProbe', JavaExec) {
    group = 'verification'
    description = 'Measure isolated Order trade-apply SQL ceiling without RabbitMQ or Spring listener overhead.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.OrderDbCeilingProbe'
}

tasks.register('orderSubmissionDbCeilingProbe', JavaExec) {
    group = 'verification'
    description = 'Measure isolated Order initial-submission SQL ceiling without HTTP, RabbitMQ, or Spring overhead.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.eap.eap_order.loadtest.OrderSubmissionDbCeilingProbe'
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = new File("$projectDir/src/main/resources/openapi/orderService.yml").toURI().toASCIIString()
    outputDir = "$buildDir/generated"
    apiPackage = "controller"
    modelPackage = "controller.dto"
    generateApiTests = false
    generateModelTests = false
    additionalProperties = [
        interfaceOnly       : "true",
        useSpringBoot3      : "true",
        useTags             : "true",
        modelPropertyNaming : "camelCase",
        lombok              : "true",
        useLombokAnnotations: "true"
    ]
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.1"
    }
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated/src/main/java"
        }
    }
}
